name: Build macOS App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build macOS packages
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          set -o pipefail
          npm run dist:mac 2>&1 | tee build-mac.log

      - name: Surface build error
        if: failure()
        shell: bash
        run: |
          if [ -f build-mac.log ]; then
            message="$(tail -n 80 build-mac.log | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk '{printf "%s%%0A", $0}')"
            echo "::error title=macOS build failed::$message"
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mac-build-log
          path: build-mac.log
          if-no-files-found: ignore

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wenrugou-macos
          path: |
            release/*.dmg
            release/*.zip
