name: Build Unsigned iOS IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-ios-unsigned:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Sync iOS project
        run: npx cap sync ios

      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          mkdir -p release-ios/Payload
          cp -R ios/build/Build/Products/Release-iphoneos/App.app release-ios/Payload/
          cd release-ios
          zip -qry "稳如狗生图工作台V1.0-iOS-unsigned-1.0.1.ipa" Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v7
        with:
          name: wenrugou-ios-unsigned-ipa
          path: release-ios/*.ipa
